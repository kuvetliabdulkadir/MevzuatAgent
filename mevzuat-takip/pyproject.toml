[project]
name = "mevzuat"
version = "0.1.0"
description = "Mevzuat takip ajanı: resmi kaynakları tarar, filtreler, bildirir."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "filelock>=3.12",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pyotp>=2.9",
    "pypdfium2>=4.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
tarayici = [
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mevzuat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["ocr: gerçek Tesseract ile çalışır; Tesseract veya Türkçe dil dosyası yoksa atlanır"]
