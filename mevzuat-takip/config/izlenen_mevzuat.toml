# Güncel (konsolide) metni takip edilen mevzuat — mevzuat.gov.tr. Ayrıntı: src/mevzuat/surum.py
#
# Bu listedeki mevzuatın metni değişince (ör. ÖTV Kanunu'nun (I) sayılı listesindeki tutarlar),
# eski ve yeni hali madde madde karşılaştırılıp "Değişen mevzuat" olarak onaya sunulur.
# İlk çekim taban olur (rapor üretmez); değişiklikler ikinci çekimden itibaren yakalanır.
#
# Bu listede olmasa da "bugün güncellenenler"de çıkan ve adı konu filtresine takılan mevzuat otomatik takibe alınır.
# Listeyi şirketle birlikte gözden geçirin. Numaraları mevzuat.gov.tr adresinden alın:
#   mevzuat?MevzuatNo=4760&MevzuatTur=1&MevzuatTertip=5  →  no = 4760, tur = 1, tertip = 5
# konu: config/konular.toml'daki konu adı (rapordaki "Etkilenen" iş kolları buradan gelir).
# Numaralar 01.10.2026'da sitede tek tek doğrulandı.

# false: güncel metin takibi tamamen kapanır (mevzuat.gov.tr'ye hiç gidilmez).
aktif = true

