# ⚠ SADECE İLK KURULUM TOHUMU (2026-10-03'ten beri): ilk çalışmada veritabanına bir kez aktarılır.
#   Sonra konular panelden (Konular sayfası, kaydetmeden önce 90 günlük önizleme) yönetilir; bu dosyayı
#   düzenlemek tek başına bir şey değiştirmez. Dosyayla değişiklik: `ayar-disa-aktar` → düzenle → `ayar-ice-aktar`.
#
# TASLAK — firmaya onaylatılmalı.
#
# Eşleşme kuralları (bkz. src/mevzuat/filtre.py):
# - Büyük/küçük harf ve Türkçe İ/ı farkı yok sayılır, â/î/û sadeleştirilir.
# - Kelime, bir kelimenin BAŞINDA geçmelidir ve ekleri kapsar: "altın" → "altının", "altınlar".
# - Bu yüzden kısa kökler yanlış eşleşebilir ("harç" → "harcırah"). Kısa kök yerine ifade kullan.
# - `haric`: metinde önce bu ifadeler (tam kelime) maskelenir, sonra eşleşme aranır.
#   Kökle başlayan ama alakasız kelimeler: "altında" (under), "altıncı" (sixth), yer adları.
# - `dislanan`: başlıkta bu ifade geçerse o konu hiç eşleşmez (ör. üniversite merkez yönetmelikleri).
#
# - `is_kollari`: bu konu hangi iş kollarını ilgilendiriyor. Raporda "Etkilenen" olarak görünür.
#   Bilinenler: "Kuyum", "Döviz/Altın", "Oto kiralama", "Ortak" (tüm şirket / muhasebe).
#   Yeni iş kolu = yeni bir ad yazmak; kod değişmez.
#
# Kaçırmak, gereksiz bildirimden daha pahalı: emin değilsen ekle, sorumlu kişi zaten onaylıyor.

