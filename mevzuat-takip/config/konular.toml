kelimeler = [
    "altın", "kıymetli maden", "kıymetli taş", "kuyum", "ziynet", "gümüş", "platin",
    "pırlanta", "elmas", "mücevher", "külçe", "darphane", "has altın", "işlenmiş altın",
]
haric = [
    "altında", "altındaki", "altındadır", "altıncı",
    # "altın"/"gümüş" ile başlayan yer adları (90 günlük testte "Altınkaya", "Gümüşhane" yakalandı)
    "altınkaya", "altındağ", "altınordu", "altınova", "altıntaş", "altınözü", "altınyayla",
    "altınekin", "altınoluk", "altınşehir", "gümüşhane", "gümüşhacıköy",
]

